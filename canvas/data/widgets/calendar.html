<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Календарь</title></head>
<body>
  <div class="cal">
    <div class="calhead">
      <button onclick="move(-1)">‹</button>
      <span id="month"></span>
      <button onclick="move(1)">›</button>
    </div>
    <div class="calgrid" id="grid"></div>
  </div>
  <script>
    const names = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
    let view = new Date();
    function move(step) { view.setMonth(view.getMonth() + step); draw(); }
    function draw() {
      const y = view.getFullYear(), m = view.getMonth();
      document.getElementById("month").textContent = names[m] + " " + y;
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      ["пн","вт","ср","чт","пт","сб","вс"].forEach(d => {
        const e = document.createElement("div"); e.className = "head"; e.textContent = d; grid.appendChild(e);
      });
      const first = new Date(y, m, 1);
      let start = (first.getDay() + 6) % 7;
      const days = new Date(y, m + 1, 0).getDate();
      for (let i = 0; i < start; i++) grid.appendChild(document.createElement("div"));
      const today = new Date();
      for (let d = 1; d <= days; d++) {
        const e = document.createElement("div");
        e.textContent = d;
        if (d === today.getDate() && m === today.getMonth() && y === today.getFullYear()) e.className = "today";
        grid.appendChild(e);
      }
    }
    draw();
  </script>
</body></html>
