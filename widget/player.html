<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Плеер</title></head>
<body>
  <div class="player">
    <div class="meta"><div id="title" class="title">Ничего не играет</div><div id="artist" class="artist"></div></div>
    <div class="controls">
      <button onclick="send('player','prev')">⏮</button>
      <button onclick="send('player','play-pause')">⏯</button>
      <button onclick="send('player','next')">⏭</button>
    </div>
  </div>
  <script>
    function send(cmd, value) { location.hash = cmd + ":" + value; }
    window.setPlayer = function (p) {
      document.getElementById("title").textContent = p.title || "Ничего не играет";
      document.getElementById("artist").textContent = p.artist || "";
    };
  </script>
</body></html>
