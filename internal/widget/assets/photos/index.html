<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фото и видео</title>
<link rel="stylesheet" href="../common.css">
<style>
  html, body { overflow: hidden; }
  .widget { padding: 0; }
  #stage { position: relative; flex: 1; min-height: 0; background: #05070a; overflow: hidden; cursor: pointer; }
  #stage img, #stage video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity .6s ease;
  }
  #stage img.show, #stage video.show { opacity: 1; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 0 24px; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: rgba(0,0,0,.35); }
  .btn { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); color: var(--fg);
    border-radius: 9px; padding: 5px 11px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .btn:hover { background: rgba(255,255,255,.16); }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #caption { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--muted); }
  #count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="widget">
  <div id="stage"><div id="empty">Сканирую папки с фото и видео…</div></div>
  <div id="bar">
    <button class="btn" id="play" aria-pressed="true">▶</button>
    <button class="btn" id="prev">‹</button>
    <button class="btn" id="next">›</button>
    <span id="caption">—</span>
    <span id="count"></span>
  </div>
</div>
<script src="../common.js"></script>
<script src="photos.js"></script>
</body>
</html>
