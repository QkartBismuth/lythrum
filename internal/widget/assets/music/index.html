<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Музыка</title>
<link rel="stylesheet" href="../common.css">
<style>
  html, body { overflow: hidden; }
  .widget { padding: 0; gap: 0; }
  #main { flex: 1; min-height: 0; display: flex; overflow: hidden; }
  #coverWrap { position: relative; flex: 0 0 42%; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #1d1424, #0b0810); }
  #cover { width: 78%; aspect-ratio: 1; border-radius: 12px; object-fit: cover; box-shadow: 0 12px 32px rgba(0,0,0,.5); display: none; }
  #coverPlaceholder { width: 78%; aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(135deg, #2a1f38, #120b14); color: var(--muted); font-size: 34px; }
  #side { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 14px 16px; gap: 8px; }
  #track { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #seek { width: 100%; accent-color: var(--accent); }
  #controls { display: flex; gap: 8px; align-items: center; }
  #controls .btn { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); color: var(--fg);
    border-radius: 9px; padding: 5px 11px; font: inherit; font-size: 12.5px; cursor: pointer; }
  #controls .btn:hover { background: rgba(255,255,255,.16); }
  #times { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  #list { flex: 1; min-height: 0; overflow: auto; font-size: 12px; border-top: 1px solid rgba(255,255,255,.08); }
  #list div { padding: 4px 6px; border-radius: 6px; cursor: pointer; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list div:hover { background: rgba(255,255,255,.07); color: var(--fg); }
  #list div.current { color: var(--accent); background: rgba(255,255,255,.06); }
  #visual { width: 100%; height: 42px; background: rgba(255,255,255,.04); border-radius: 8px; }
</style>
</head>
<body>
<div class="widget">
  <div id="main">
    <div id="coverWrap">
      <img id="cover" alt="">
      <div id="coverPlaceholder">♪</div>
    </div>
    <div id="side">
      <div>
        <div id="track">—</div>
        <div id="meta">ничего не играет</div>
      </div>
      <canvas id="visual" width="600" height="42"></canvas>
      <div id="controls">
        <button class="btn" id="prev">⏮</button>
        <button class="btn" id="play">▶</button>
        <button class="btn" id="next">⏭</button>
        <span id="position" style="font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums">0:00</span>
      </div>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <div id="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
      <div id="list"></div>
    </div>
  </div>
</div>
<script src="../common.js"></script>
<script src="music.js"></script>
</body>
</html>
