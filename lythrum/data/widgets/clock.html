<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Часы</title></head>
<body>
  <div class="clock">
    <div id="time" class="time">--:--</div>
    <div id="date" class="date"></div>
  </div>
  <script>
    const pad = n => String(n).padStart(2, "0");
    function tick() {
      const d = new Date();
      document.getElementById("time").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
      document.getElementById("date").textContent = d.toLocaleDateString("ru-RU", {weekday:"long", day:"numeric", month:"long"});
    }
    tick();
    setInterval(tick, 500);
  </script>
</body></html>
